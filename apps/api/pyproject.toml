[project]
name = "unihub-insight-api"
version = "1.0.0rc3"
description = "Read-only analytics API for UniHub Insight."
readme = "../../README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "asyncpg==0.31.0",
  "fastapi[standard]==0.141.1",
  "orjson==3.11.9",
  "pydantic-settings==2.14.2",
  "xlsxwriter>=3.2,<4",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.1",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unihub_insight_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "../.."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"src/unihub_insight_api/repositories/monthly_review.py" = ["E501"]
"src/unihub_insight_api/repositories/demo_modules.py" = ["E501"]
"src/unihub_insight_api/repositories/postgres_modules.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["tests/"]
allow_redefinition = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
  "unihub_insight_api.db",
  "unihub_insight_api.repositories.dashboards",
  "unihub_insight_api.repositories.postgres",
  "unihub_insight_api.repositories.postgres_modules",
  "unihub_insight_api.repositories.monthly_review",
]
disable_error_code = ["no-any-return"]
