name: Monthly Review Python Autofix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: monthly-review-python-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          uv sync --project apps/api --frozen --all-groups

      - name: Apply Python lint fixes
        run: uv run --project apps/api ruff check --fix apps/api/src apps/api/tests

      - name: Format and verify
        shell: bash
        run: |
          npm run format
          set +e
          npm run verify > verification-output.txt 2>&1
          status=$?
          cat verification-output.txt
          echo "$status" > /tmp/verify-status
          exit 0

      - name: Publish corrections and evidence
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat /tmp/verify-status)"
          rm -f .github/workflows/monthly-review-autofix.yml
          if [[ "$status" == "0" ]]; then
            rm -f verification-output.txt
          fi
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: apply Python verification corrections"
          git push origin "HEAD:${{ github.head_ref }}"
          [[ "$status" == "0" ]]
