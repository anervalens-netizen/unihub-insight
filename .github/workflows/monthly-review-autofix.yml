name: Monthly Review Autofix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: monthly-review-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply semantic lint corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('apps/web/src/app/GlobalFilters.tsx'): [
                  ('<div className="global-filters" aria-label="Filtre globale">', '<div className="global-filters" role="group" aria-label="Filtre globale">'),
              ],
              Path('apps/web/src/features/modules/widgets.tsx'): [
                  ('<div className="chart-toggle" aria-label="Tip de grafic">', '<div className="chart-toggle" role="group" aria-label="Tip de grafic">'),
              ],
              Path('apps/web/src/components/dashboard/WidgetFrame.tsx'): [
                  (
                      '              role="presentation"\n              onMouseDown={() => setExpanded(false)}',
                      '              role="button"\n              tabIndex={0}\n              aria-label="Închide fereastra extinsă"\n              onKeyDown={(event) => {\n                if (event.key === \'Enter\' || event.key === \' \') setExpanded(false);\n              }}\n              onMouseDown={() => setExpanded(false)}',
                  ),
              ],
              Path('apps/web/src/features/modules/DataInspector.tsx'): [
                  (
                      '<div className="widget-modal-backdrop" role="presentation" onMouseDown={onClose}>',
                      '<div\n      className="widget-modal-backdrop"\n      role="button"\n      tabIndex={0}\n      aria-label="Închide inspectorul de date"\n      onKeyDown={(event) => {\n        if (event.key === \'Enter\' || event.key === \' \') onClose();\n      }}\n      onMouseDown={onClose}\n    >',
                  ),
                  (
                      "                {rows.map((row, index) => (\n                  <tr key={`${widgetId}-${index}`}>",
                      "                {rows.map((row) => (\n                  <tr key={`${widgetId}-${columns.map((column) => String(row[column] ?? '')).join('|')}`}>",
                  ),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in changes:
                  if old not in text:
                      raise RuntimeError(f'Expected fragment missing in {path}: {old[:80]}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          uv sync --project apps/api --frozen --all-groups

      - name: Apply Biome fixes and capture remaining diagnostics
        shell: bash
        run: |
          set +e
          cd apps/web
          npx biome check --write --unsafe src tests vite.config.ts > ../../biome-output.txt 2>&1
          status=$?
          cat ../../biome-output.txt
          echo "$status" > /tmp/biome-status
          exit 0

      - name: Format and verify
        shell: bash
        run: |
          npm run format
          set +e
          npm run verify > verification-output.txt 2>&1
          status=$?
          cat verification-output.txt
          echo "$status" > /tmp/verify-status
          exit 0

      - name: Publish corrections and evidence
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat /tmp/verify-status)"
          if [[ "$status" == "0" ]]; then
            rm -f verification-output.txt biome-output.txt
          fi
          rm -f .github/workflows/monthly-review-autofix.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: verify monthly review implementation"
          git push origin "HEAD:${{ github.head_ref }}"
          [[ "$status" == "0" ]]
