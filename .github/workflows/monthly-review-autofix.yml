name: Monthly Review Format and Verify

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: monthly-review-format-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          uv sync --project apps/api --frozen --all-groups
      - name: Format source
        run: npm run format
      - name: Capture verification
        shell: bash
        run: |
          set +e
          npm run verify > verification-output.txt 2>&1
          status=$?
          cat verification-output.txt
          echo "$status" > verification-status.txt
          exit 0
      - name: Publish formatted source and evidence
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat verification-status.txt)"
          rm -f .github/workflows/monthly-review-autofix.yml
          rm -f ruff-output.txt
          if [[ "$status" == "0" ]]; then
            rm -f verification-output.txt verification-status.txt
          fi
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: format and verify monthly review"
          git push origin "HEAD:${{ github.head_ref }}"
