name: Verify

on:
  workflow_dispatch:
  push:
    paths:
      - .github/verify-now

permissions:
  contents: write

concurrency:
  group: unihub-insight-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          working-directory: apps/api

      - name: Install locked web dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install locked API dependencies
        run: uv sync --project apps/api --frozen --all-groups

      - name: Normalize source
        run: |
          npm run format
          npm --workspace @unihub-insight/web exec -- biome check --write src tests vite.config.ts
          uv run --project apps/api ruff check --fix apps/api/src apps/api/tests

      - name: Verify source
        run: npm run verify

      - name: Persist verified normalization
        run: |
          rm -rf .bootstrap
          rm -f .github/verify-now
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: persist verified normalization"
            git push
          fi
