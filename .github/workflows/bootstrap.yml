name: Bootstrap UniHub Insight

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: bootstrap-unihub-insight-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Expand and verify staged source
        id: expand
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G ".bootstrap/chunk-*" > /dev/null; then
            echo "expanded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat .bootstrap/chunk-* > /tmp/unihub-insight-source.tar.gz.b64
          base64 --decode /tmp/unihub-insight-source.tar.gz.b64 > /tmp/unihub-insight-source.tar.gz
          echo "5591ddab1fc5a97dab408662e04d6bb12f259e32175dfa25db31fc06b3a24534  /tmp/unihub-insight-source.tar.gz" | sha256sum --check -
          tar -xzf /tmp/unihub-insight-source.tar.gz -C .
          rm -rf .bootstrap
          echo "expanded=true" >> "$GITHUB_OUTPUT"

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Configure uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Install API dependencies
        run: uv sync --project apps/api --all-groups

      - name: Verify complete repository
        run: npm run verify

      - name: Publish verified foundation to PR branch
        if: steps.expand.outputs.expanded == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build UniHub Insight foundation"
          git push origin "HEAD:${{ github.head_ref }}"
