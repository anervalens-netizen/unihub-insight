name: Remove stale branches

on:
  push:
    paths:
      - .github/branch-cleanup-now

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Delete verified stale branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "feat/monthly-performance-review"
            "agent/preinstall-complete"
            "bootstrap/foundation"
            "noop-temp-check"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            fi
          done

          mapfile -t remaining < <(git ls-remote --heads origin | awk '{print $2}' | sort)
          printf 'Remaining branches:\n%s\n' "${remaining[*]}"
          test "${#remaining[@]}" -eq 1
          test "${remaining[0]}" = "refs/heads/main"
