name: Diagnose Monthly Review

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: monthly-review-diagnose-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          uv sync --project apps/api --frozen --all-groups
      - name: Capture verification
        shell: bash
        run: |
          set +e
          npm run verify > verification-output.txt 2>&1
          status=$?
          cat verification-output.txt
          echo "$status" > verification-status.txt
          exit 0
      - name: Publish evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/monthly-review-diagnose.yml
          rm -f ruff-output.txt
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: capture monthly review verification"
          git push origin "HEAD:${{ github.head_ref }}"
