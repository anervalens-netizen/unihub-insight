name: Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'ops/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/quality.yml'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install web dependencies
        run: |
          if [[ -f package-lock.json ]]; then npm ci --ignore-scripts; else npm install --ignore-scripts --no-audit --no-fund; fi
      - name: Install API dependencies
        run: |
          if [[ -f apps/api/uv.lock ]]; then uv sync --project apps/api --frozen --all-groups; else uv sync --project apps/api --all-groups; fi
      - name: Verify
        run: npm run verify
