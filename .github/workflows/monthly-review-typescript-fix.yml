name: Fix Monthly Review TypeScript

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: monthly-review-typescript-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply strict TypeScript corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"Expected fragment missing in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "apps/web/src/app/AppShell.tsx",
              "document.documentElement.dataset.theme = dark ? 'dark' : 'light';",
              "document.documentElement.dataset['theme'] = dark ? 'dark' : 'light';",
          )
          replace(
              "apps/web/src/app/Sidebar.tsx",
              "search={(previous) => previous}",
              "search={true}",
          )
          Path("apps/web/src/app/search-hooks.ts").write_text(
              """import { useNavigate, useSearch } from '@tanstack/react-router';
          import { useCallback } from 'react';

          import {
            globalSearchSchema,
            type GlobalSearch,
            type GlobalSearchPatch,
          } from '../lib/search';

          export function useGlobalSearch(): GlobalSearch {
            return useSearch({ from: '__root__' });
          }

          export function useUpdateGlobalSearch() {
            const navigate = useNavigate({ from: '__root__' });
            const search = useGlobalSearch();
            return useCallback(
              (patch: GlobalSearchPatch, replace = false): void => {
                const nextSearch = globalSearchSchema.parse({ ...search, ...patch });
                void navigate({ search: nextSearch, replace });
              },
              [navigate, search],
            );
          }
          """,
              encoding="utf-8",
          )
          replace(
              "apps/web/src/components/dashboard/DashboardCanvas.tsx",
              "    gridRef.current = grid;\n",
              "    if (!grid) return;\n    gridRef.current = grid;\n",
          )
          replace(
              "apps/web/src/components/dashboard/DashboardCanvas.tsx",
              "      grid.off('change', persist);",
              "      grid.off('change');",
          )
          replace(
              "apps/web/src/components/dashboard/DashboardCanvas.tsx",
              """              <WidgetFrame
                title={widget.title}
                subtitle={widget.subtitle}
                editMode={editMode}
                {...inspectProps}
              >""",
              """              <WidgetFrame
                title={widget.title}
                editMode={editMode}
                {...(widget.subtitle === undefined ? {} : { subtitle: widget.subtitle })}
                {...inspectProps}
              >""",
          )
          replace(
              "apps/web/src/features/modules/widgets.tsx",
              """function ChartToggle({
  options,
  value,
  onChange,
}: {
  options: readonly ChartKind[];
  value: ChartKind;
  onChange: (value: ChartKind) => void;
}) {""",
              """function ChartToggle<Kind extends ChartKind>({
  options,
  value,
  onChange,
}: {
  options: readonly Kind[];
  value: Kind;
  onChange: (value: Kind) => void;
}) {""",
          )
          replace(
              "apps/web/src/lib/rum.ts",
              "import.meta.env.VITE_RUM_ENABLED",
              "import.meta.env['VITE_RUM_ENABLED']",
          )
          replace(
              "apps/web/src/lib/search.ts",
              "const year = parts.year;\n  const month = parts.month;",
              "const year = parts['year'];\n  const month = parts['month'];",
          )
          Path("apps/web/vite.config.ts").write_text(
              """import react from '@vitejs/plugin-react';
          import { defineConfig } from 'vite';

          export default defineConfig({
            plugins: [react()],
            server: {
              port: 3100,
              strictPort: true,
            },
            preview: {
              port: 3100,
              strictPort: true,
            },
            build: {
              target: 'es2022',
              sourcemap: true,
              cssCodeSplit: true,
              reportCompressedSize: true,
              rollupOptions: {
                output: {
                  manualChunks(id) {
                    const normalized = id.replaceAll('\\\\', '/');
                    if (!normalized.includes('/node_modules/')) return undefined;
                    if (
                      normalized.includes('/react/') ||
                      normalized.includes('/react-dom/') ||
                      normalized.includes('/scheduler/')
                    ) {
                      return 'vendor-react';
                    }
                    if (normalized.includes('/@tanstack/')) return 'vendor-tanstack';
                    if (normalized.includes('/gridstack/')) return 'vendor-grid';
                    if (normalized.includes('/echarts/') || normalized.includes('/zrender/')) {
                      return 'vendor-charts';
                    }
                    return 'vendor';
                  },
                },
              },
            },
          });
          """,
              encoding="utf-8",
          )
          PY

      - name: Install and lock web-vitals
        run: npm install --workspace @unihub-insight/web web-vitals --save-exact --no-audit --no-fund

      - name: Install API dependencies
        run: uv sync --project apps/api --frozen --all-groups

      - name: Format and verify
        shell: bash
        run: |
          npm run format
          set +e
          npm run verify > verification-output.txt 2>&1
          status=$?
          cat verification-output.txt
          echo "$status" > verification-status.txt
          exit 0

      - name: Publish fixes and evidence
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat verification-status.txt)"
          rm -f .github/workflows/monthly-review-typescript-fix.yml
          rm -f ruff-output.txt
          if [[ "$status" == "0" ]]; then
            rm -f verification-output.txt verification-status.txt
          fi
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: satisfy strict frontend contracts"
          git push origin "HEAD:${{ github.head_ref }}"
